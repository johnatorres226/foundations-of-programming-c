  "questions": [
    {
      "q": "A `while` loop's condition is false the very first time it is checked. What happens?",
      "options": [
        { "text": "The body runs once anyway, then the loop stops",
          "correct": false,
          "why": "That describes `do`/`while`, not `while`. A plain `while` loop checks its condition before it ever runs the body — a false first check skips the body entirely." },
        { "text": "The body never runs at all — zero iterations",
          "correct": true,
          "why": "Right. `while` checks its condition before every iteration, including the first one. If it starts out false, the body is skipped completely, and that is a normal, expected outcome." },
        { "text": "It is a compile error — a loop must run at least once",
          "correct": false,
          "why": "C has no such rule. A loop that never runs its body is valid, ordinary code, not a mistake the compiler rejects." }
      ]
    },
    {
      "q": "Why does `count_digits(0)` need a `do`/`while` loop instead of a `while` loop to return `1` correctly?",
      "options": [
        { "text": "`do`/`while` runs its body first and checks the condition afterward, so it counts at least one digit even when the starting condition would already be false",
          "correct": true,
          "why": "Right. Zero has one digit, but a `while` loop with a condition like `n > 0` would never enter its body at all when `n` starts at `0`, undercounting by one." },
        { "text": "`do`/`while` loops run exactly one more time than `while` loops, always",
          "correct": false,
          "why": "There is no fixed \"one extra time\" rule. `do`/`while` only differs from `while` when the condition is false on the very first check — otherwise both run the same number of iterations." },
        { "text": "`while` loops cannot use `n` as a condition variable",
          "correct": false,
          "why": "Any variable can appear in a `while` condition. The real difference between the two loop forms is only when the condition gets checked — before the body, or after it." }
      ]
    },
    {
      "q": "What are the three parts inside `for (int i = 0; i < 5; i++)`, in the order they are written?",
      "options": [
        { "text": "Initializer, condition, update",
          "correct": true,
          "why": "Right. `int i = 0` runs once before the loop starts. `i < 5` is checked before every iteration. `i++` runs after the body, at the end of every iteration." },
        { "text": "Condition, initializer, update",
          "correct": false,
          "why": "The initializer always comes first in a `for` loop's parentheses, and it only ever runs once — before any condition is checked." },
        { "text": "Initializer, update, condition",
          "correct": false,
          "why": "The condition is the middle part, checked before every iteration. The update comes last, and only runs after the loop body, not before the condition check." }
      ]
    },
    {
      "q": "A loop is meant to print every whole number from 1 to 10, but it only prints 1 through 9. What is this bug called, and what is the likely fix?",
      "options": [
        { "text": "An off-by-one error; the condition likely uses `i < 10` instead of `i <= 10`",
          "correct": true,
          "why": "Right. The loop is stopping one iteration short of the intended boundary. Changing `<` to `<=` includes the endpoint the task actually wanted." },
        { "text": "An infinite loop; the update statement is missing",
          "correct": false,
          "why": "The loop did stop — it just stopped one number early. An infinite loop never stops at all, which is a different symptom entirely." },
        { "text": "Undefined behavior; the loop variable overflowed",
          "correct": false,
          "why": "An ordinary `int` counting to 10 is nowhere near overflowing. This is a boundary mistake in the condition, not a value outgrowing its type." }
      ]
    },
    {
      "q": "`while (n >= 0) { ... n--; ... }` never stops when `n` is declared as `unsigned int`. Why?",
      "options": [
        { "text": "`unsigned` types cannot hold the value `0`, so `n` skips over it",
          "correct": false,
          "why": "`0` is a perfectly ordinary value for an unsigned type — it is the value just below `0` that unsigned types cannot represent, which is the actual problem here." },
        { "text": "When `n` reaches `0` and is decremented again, it wraps around to a large positive number instead of going negative, so `n >= 0` stays true forever",
          "correct": true,
          "why": "Right. An unsigned type can never be negative — subtracting past `0` wraps around to its largest value instead, the same guaranteed wraparound Chapter 1.3 covered. The condition never sees a negative number to stop on." },
        { "text": "`>=` is not a valid comparison for unsigned types",
          "correct": false,
          "why": "`>=` works fine on unsigned types — the compiler accepts this code without complaint. The danger is a silent wraparound at runtime, not a rejected comparison." }
      ]
    }
  ]
