  "questions": [
    {
      "q": "A compiler error reads `rectangle.c:6:17`. What does the `17` mean?",
      "options": [
        { "text": "There are 17 errors left to fix",
          "correct": false,
          "why": "That number is not an error count. The three numbers after the filename are line and column — this is a single location, not a tally." },
        { "text": "The problem is at column 17 of line 6 — count characters from the start of that line",
          "correct": true,
          "why": "Right. `file:line:column` is the compiler's location format. Column 17 tells you exactly where on that line to look, instead of scanning the whole line yourself." },
        { "text": "The program will take 17 seconds to compile",
          "correct": false,
          "why": "Compile time has nothing to do with this. Every number in a compiler error location describes where in the file the problem is, not how long anything takes." }
      ]
    },
    {
      "q": "A wall of ten compiler errors appears after one small edit. What should you do first?",
      "options": [
        { "text": "Fix all ten, then recompile once",
          "correct": false,
          "why": "One real mistake often confuses the compiler about everything after it, so most of those ten errors may not be real. Fixing all ten wastes time chasing errors that were never there." },
        { "text": "Fix only the first error, then recompile before reading the rest",
          "correct": true,
          "why": "Right. An early mistake — a missing semicolon, an unclosed brace — throws off everything the compiler reads afterward. Fix the first one and recompile; many of the rest often disappear on their own." },
        { "text": "Delete the file and start over",
          "correct": false,
          "why": "Ten errors almost never means ten real mistakes. Starting over throws away working code to avoid reading one error message carefully." }
      ]
    },
    {
      "q": "What does `-Werror` actually do?",
      "options": [
        { "text": "It turns every warning the compiler would otherwise print into a hard error that stops the build",
          "correct": true,
          "why": "Right. `-Wall -Wextra` turn on the warnings worth seeing; `-Werror` makes sure you cannot ignore them and get a program anyway." },
        { "text": "It finds warnings the compiler would otherwise miss entirely",
          "correct": false,
          "why": "`-Wall` and `-Wextra` are what turn on more warnings. `-Werror` does not detect anything new — it changes what happens to warnings that were already going to be reported." },
        { "text": "It only affects error messages, not warnings",
          "correct": false,
          "why": "The opposite is true — `-Werror` specifically targets warnings, converting them into errors. Genuine errors already stop the build with or without this flag." }
      ]
    },
    {
      "q": "You set a breakpoint on a line inside a loop and run the program under a debugger. What happens?",
      "options": [
        { "text": "The debugger stops the program once, the first time that line runs, and never again",
          "correct": false,
          "why": "A breakpoint fires every time execution reaches that line, not only once. Inside a loop, that usually means once per trip around." },
        { "text": "The program pauses each time it reaches that line, and `continue` resumes it until the next time it gets there",
          "correct": true,
          "why": "Right. Inside a loop, this means one pause per iteration — exactly how the chapter's example watched a loop variable change, iteration by iteration." },
        { "text": "The debugger skips the loop entirely and runs straight to the end of the program",
          "correct": false,
          "why": "A breakpoint does the opposite of skipping — it is specifically there to stop execution at that exact line so you can look around." }
      ]
    },
    {
      "q": "Why does a debugging session need the program compiled with `-g`?",
      "options": [
        { "text": "`-g` makes the compiled program run faster under a debugger",
          "correct": false,
          "why": "`-g` has no effect on speed. It only adds information to the compiled file — it does not change what the program does or how fast it runs." },
        { "text": "`-g` embeds line numbers and variable names so the debugger can connect what is happening back to your source file",
          "correct": true,
          "why": "Right. Without `-g`, a debugger can still run the program, but it only sees raw instructions — no file, no line, no variable names to show you." },
        { "text": "`-g` is required before the compiler will accept any breakpoints at all",
          "correct": false,
          "why": "Breakpoints are a debugger feature, not a compiler one — the compiler does not know about them. `-g` only supplies the information the debugger needs to display them meaningfully." }
      ]

    {
      "q": "A program writes one slot past the end of a 5-slot heap array, then runs and prints five correct-looking numbers with no crash. What does this show?",
      "options": [
        { "text": "The program has no bug, since it printed the right output",
          "correct": false,
          "why": "The overflow already happened, even though the output looked fine. Undefined behavior is exactly this: it makes no promise about what happens, including sometimes looking like it worked." },
        { "text": "Writing one slot past the end is undefined behavior — the program may look fine and still have written to memory it never should have touched",

          "why": "Right. A buffer overflow does not have to crash to be a real bug. This is precisely why a tool that watches every memory access, like AddressSanitizer, exists — the output alone cannot tell you." },
        { "text": "C automatically resizes the array to fit the extra slot",
          "correct": false,
          "why": "C never resizes memory for you. A `malloc`'d block is a fixed size for its whole lifetime; writing past it reaches into memory that belongs to something else." }

        { "text": "No bad memory access happened during that particular run — but a path that was not exercised could still hide a bug",
